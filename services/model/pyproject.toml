[project]
name = "noema-model"
version = "0.0.0"
description = "The Noema model service: Understanding, Explanation and Voice, behind provider-neutral interfaces (SoT §35.6)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "opentelemetry-api==1.45.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "mypy==2.4.0",
    "hypothesis==6.170.5",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["."]
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
