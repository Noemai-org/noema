# compose-scripts (ruling A38, DEBT-16): the shell tests of deploy/compose that need a database run against PostgreSQL 17.11, the same pinned image
# as core.yml and deploy/compose, inside that image (its initdb, pg_ctl and psql), as its unprivileged postgres user; all three scripts run there, test_secrets_local.sh included (A38, as the reviewer of noema#181 read it). They need no Docker daemon of their own
# and no secret. The workflow always triggers so its check always reports; the path filter runs inside the job.
name: compose-scripts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  compose-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if git diff --name-only "$base" HEAD | grep -qE '^(deploy/compose/|\.github/workflows/compose-scripts\.yml)'; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        run: |
          docker run --rm --user root --entrypoint sh -v "$PWD:/repo:ro" -w /repo \
            postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 -euc '
            apk add --no-cache python3 su-exec >/dev/null # secrets_local.sh needs python3 and the unprivileged run needs su-exec; the image ships neither
            su-exec postgres sh -euc "
              initdb --version | grep -q \"(PostgreSQL) 17.11\" || { echo \"not PostgreSQL 17.11\"; initdb --version; exit 1; }
              for t in deploy/compose/postgres/test_init.sh deploy/compose/postgres/test_provision_env.sh deploy/compose/test_secrets_local.sh; do
                echo \"== \$t\"; sh \"\$t\"
              done"'
