# compose-scripts (ruling A38, DEBT-16): the shell tests of deploy/compose that need a database run against PostgreSQL 17.11 with pgsodium, the same pinned
# image as core.yml (built from deploy/spike/pgsodium: init.sh creates the pgsodium extension, EXE-08 D10a, and the stock postgres image does not have it),
# inside that image (its initdb, pg_ctl and psql), as its unprivileged postgres user. They need no Docker daemon of their own and no secret. The workflow always triggers so its check always reports; the path filter runs inside the job.
name: compose-scripts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  compose-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if git diff --name-only "$base" HEAD | grep -qE '^(deploy/compose/|services/core/migrations/|\.github/workflows/compose-scripts\.yml)'; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi
      # The database image: PostgreSQL 17.11 with pgsodium, built from the pinned Dockerfile (base image by digest, libsodium by SHA-256, pgsodium by commit id),
      # as core.yml does. A stock postgres:17.11 image fails init.sh at CREATE EXTENSION pgsodium.
      - name: build the PostgreSQL 17.11 + pgsodium image
        if: steps.changed.outputs.run == 'true'
        run: docker build -t noema-pg-sig:ci deploy/spike/pgsodium
      # One step per script, each in the same pinned image, so that the first failure does not hide the next (`!cancelled()` runs a step after a failed one).
      - name: test_init.sh (PostgreSQL 17.11)
        if: steps.changed.outputs.run == 'true'
        run: |
          docker run --rm --user postgres --entrypoint sh -v "$PWD:/repo:ro" -w /repo \
            noema-pg-sig:ci -euc '
            initdb --version | grep -q "(PostgreSQL) 17.11" || { echo "not PostgreSQL 17.11"; initdb --version; exit 1; }
            sh deploy/compose/postgres/test_init.sh'
      - name: test_provision_env.sh (PostgreSQL 17.11)
        if: ${{ !cancelled() && steps.changed.outputs.run == 'true' }}
        run: |
          docker run --rm --user postgres --entrypoint sh -v "$PWD:/repo:ro" -w /repo \
            noema-pg-sig:ci -euc '
            initdb --version | grep -q "(PostgreSQL) 17.11" || { echo "not PostgreSQL 17.11"; initdb --version; exit 1; }
            sh deploy/compose/postgres/test_provision_env.sh'
      # secrets_local.sh needs python3, which the PostgreSQL image does not have, and touches no database: it runs on the runner (Founder decision D7).
      - name: test_secrets_local.sh (runner)
        if: ${{ !cancelled() && steps.changed.outputs.run == 'true' }}
        run: sh deploy/compose/test_secrets_local.sh
