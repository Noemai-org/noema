# Architecture lint (PLT-03). Runs the rules, then proves each rule can fail (canaries).
name: arch-lint
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  arch-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tools/lint/golint/go.mod
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: (cd tools/lint/golint && go vet ./... && go test ./...)
      - run: python3 -I tools/lint/run.py
      - run: python3 -I tools/lint/run.py --canaries
