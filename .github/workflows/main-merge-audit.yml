# main-merge-audit: raise an alarm when an arrival on main has no independent approving review.
#
# The unit of audit is an arrival on main, not a commit object. A pull request merged into main is one
# arrival (its merge commit); the commits it carries were reviewed, or not, as part of that pull request
# and are not audited one by one. A direct push of N commits is N arrivals. For each arrival the audit
# finds the pull request (merge_commit_sha first, then the associated-pull-requests endpoint, accepting
# only a pull request that merged INTO main with this commit as its merge commit) and opens a GitHub
# issue (label "governance", title "Unreviewed merge to main: <short sha>") when any of these holds:
#   no_pull_request       no such pull request exists (a direct push to main, or a merge from a pull
#                         request that targeted another branch);
#   no_approval           the pull request has no approving review (the latest state of each reviewer
#                         counts, so an approval followed by CHANGES_REQUESTED does not);
#   author_approval_only  every approving review came from the pull request's own author;
#   stale_approval        an independent approving review exists, but none was given on the head that was
#                         merged (commits were pushed after the approval). The merged head is the second
#                         parent of the merge commit, or the pull request's recorded head for a squash or
#                         rebase merge; each review carries the commit it was given on.
# WHO CAN SATISFY THE APPROVAL RULE. An approval counts only from an account of type "User" other than the
# pull request's author. Apps and bots (account type "Bot") never count. Today that means:
#   noemai-systems        (a User; approves the pull requests of OladiranOlatunde)
#   OladiranOlatunde      (a User; only on pull requests they did not author)
# One issue per commit, found by SHA among open and closed issues labelled governance or
# governance-historical.
#
# The logic is in .github/scripts/main-merge-audit.js; the offline tests are in .github/tests/.
# A workflow_dispatch run is a dry run: it evaluates the commit given as input and logs what it would do.
#
# Known limits:
#   - It reports after the fact. It cannot stop a merge.
#   - Anyone with write access can still push to main.
#   - It is replaced by real branch protection once the GitHub plan allows it.
# Until then a "governance" issue is resolved before the next merge (AGENTS.md section 11).
name: main-merge-audit
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Dry run: a commit on main to evaluate as an arrival (nothing is opened)"
        required: true
      evaluate_reported:
        description: "Dry run: evaluate the commit even if an issue for it already exists (true or false)"
        required: false
        default: "false"
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  main-merge-audit:
    name: main-merge-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            // INSTALLATION CUTOFF. Only arrivals after this commit are audited. It is the tip of main just
            // before this workflow first reached main (the merge of pull request #15). The arrival that
            // installed the workflow, the merge of pull request #16, is itself audited. Everything earlier
            // is covered by the historical review-gap record on Noemai-org/noema#7. This is not an
            // amnesty; it is a fixed, checkable point.
            const AUDIT_AFTER = {
              sha: "9cd4ca74e80924c3ea4972734d92c939452ec430",
              date: "2026-10-19T10:15:59Z",
            };
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/main-merge-audit.js`);
            await run({ github, context, core, cutoff: AUDIT_AFTER });
