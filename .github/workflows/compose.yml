# Compose stack and connection-test matrix (PLT-04; REQ-OPS-001).
name: compose
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # SEC-11: the topology of every run profile (dev, ci, bench, demo), read from `docker compose config`; needs no running stack.
      - run: python3 -I deploy/compose/netcheck/profiles.py --self-test
      # ENV-13: the relay host script refuses a DuckDNS token file that could change the curl configuration line (--check only; changes nothing).
      - run: python3 -I deploy/relay-host/test_setup.py
      - run: make up
      - run: docker compose -f deploy/compose/docker-compose.yml --profile dev ps
      # The TEN-01 line is checked, not only printed: if matrix.py stopped printing it the job would still pass (A274; the Security Reviewer's note 3 on noema#578).
      - run: |
          set +e
          make net-matrix > "$RUNNER_TEMP/net-matrix.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/net-matrix.txt"
          [ "$code" -eq 0 ] || exit "$code"
          grep -Eq 'TEN_RESULT id=TEN-01 seed=none pass=true$' "$RUNNER_TEMP/net-matrix.txt"
      - run: make bench-smoke
      - if: always()
        run: make reset
