# Compose stack and connection-test matrix (PLT-04; REQ-OPS-001).
name: compose
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # SEC-09 (REQ-SEC-005, INV-03, INV-25; SR's answer on noema#692): the key-rotation drill runs in the core image with a tmpfs work directory, no network, no secret and no capability. It makes
  # synthetic keys, loads them with the loader the core uses and runs the drill on simulated time; exit 0 only if no valid grant is rejected, no forgery is accepted and its control is detected.
  # What only the stack can show (the CORE container loading the two mounted keys) waits for the core's wiring of NOEMA_GRANT_KEY_DIR.
  grantdrill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build -t noema-core:drill services/core
      - run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true             --tmpfs /work:rw,noexec,nosuid,nodev,size=1m,mode=0700,uid=65532,gid=65532             --entrypoint /usr/local/bin/grantdrill noema-core:drill --work /work
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # SEC-11: the topology of every run profile (dev, ci, bench, demo), read from `docker compose config`; needs no running stack.
      - run: python3 -I deploy/compose/netcheck/profiles.py --self-test
      # ENV-13: the relay host script refuses a DuckDNS token file that could change the curl configuration line (--check only; changes nothing).
      - run: python3 -I deploy/relay-host/test_setup.py
      - run: make up
      - run: docker compose -f deploy/compose/docker-compose.yml --profile dev ps
      # The TEN-01 line is checked, not only printed: if matrix.py stopped printing it the job would still pass (A274; the Security Reviewer's note 3 on noema#578).
      - run: |
          set +e
          make net-matrix > "$RUNNER_TEMP/net-matrix.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/net-matrix.txt"
          [ "$code" -eq 0 ] || exit "$code"
          grep -Eq 'TEN_RESULT id=TEN-01 seed=none pass=true$' "$RUNNER_TEMP/net-matrix.txt"
      - run: make bench-smoke
      - if: always()
        run: make reset
