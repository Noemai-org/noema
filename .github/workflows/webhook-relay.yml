# Webhook relay CI (ENV-13). Builds and tests synthetic/webhook_relay only. No GitHub Environment: it needs no
# secret. The workflow always triggers so its check always reports; the path filter runs inside the job.
name: webhook-relay
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  webhook-relay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if git diff --name-only "$base" HEAD | grep -qE '^(synthetic/webhook_relay/|deploy/compose/services/webhook-relay|\.github/workflows/webhook-relay\.yml)'; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: synthetic/webhook_relay/go.mod
          cache: false
      - if: steps.changed.outputs.run == 'true'
        working-directory: synthetic/webhook_relay
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
          go build ./...
      - if: steps.changed.outputs.run == 'true'
        run: docker build -t noema-webhook-relay:ci synthetic/webhook_relay
      - if: steps.changed.outputs.run != 'true'
        run: echo "no synthetic/webhook_relay change; nothing to build"
