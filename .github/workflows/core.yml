# Core CI (PLT-01). Builds and tests services/core only. Environment: core-ci (DEC-2026-10-13 R3).
# The workflow always triggers so the required check "core" always reports; the path filter runs inside the job.
name: core
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    environment: core-ci
    env:
      NOEMA_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
      EXPECTED_POSTGRES: "17.11"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if git diff --name-only "$base" HEAD | grep -qE '^(services/core/|deploy/spike/pgsodium/|\.github/workflows/core\.yml)'; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi
      # A16 (ruling of 6 Nov 2026): the database the tests run against is PostgreSQL 17.11 with pgsodium, built from the pinned Dockerfile (base image
      # by digest, libsodium by SHA-256, pgsodium by commit id). Trust authentication is for this throwaway, job-local container only; it holds synthetic data.
      - if: steps.changed.outputs.run == 'true'
        run: |
          docker build -t noema-pg-sig:ci deploy/spike/pgsodium
          docker run -d --name noema-pg-sig -e POSTGRES_HOST_AUTH_METHOD=trust -p 127.0.0.1:5432:5432 noema-pg-sig:ci
          for _ in $(seq 1 60); do docker exec noema-pg-sig pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1; done
          sleep 2
          docker exec noema-pg-sig pg_isready -U postgres
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/core/go.mod
          cache-dependency-path: services/core/go.mod
      - if: steps.changed.outputs.run == 'true'
        working-directory: services/core
        run: |
          server="$(psql "$NOEMA_TEST_DATABASE_URL" -tAc 'SHOW server_version' | cut -d' ' -f1)"
          echo "test database: PostgreSQL $server"
          test "$server" = "$EXPECTED_POSTGRES"
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          go build ./...
      - if: steps.changed.outputs.run == 'true'
        run: docker build -t noema-core:ci services/core
      - if: steps.changed.outputs.run != 'true'
        run: echo "no services/core change; nothing to build"
