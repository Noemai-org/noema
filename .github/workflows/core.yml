# Core CI (PLT-01). Builds and tests services/core only. Environment: core-ci (DEC-2026-10-13 R3).
# The workflow always triggers so the required check "core" always reports; the path filter runs inside the job.
name: core
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    environment: core-ci
    # The tests run against the same PostgreSQL as deploy/compose (17.11, pinned by digest), never the runner image's
    # own server. Trust authentication is for this throwaway, job-local container only; it holds synthetic data.
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      NOEMA_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
      EXPECTED_POSTGRES: "17.11"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if git diff --name-only "$base" HEAD | grep -qE '^(services/core/|\.github/workflows/core\.yml)'; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/core/go.mod
          cache-dependency-path: services/core/go.mod
      - if: steps.changed.outputs.run == 'true'
        working-directory: services/core
        run: |
          server="$(psql "$NOEMA_TEST_DATABASE_URL" -tAc 'SHOW server_version' | cut -d' ' -f1)"
          echo "test database: PostgreSQL $server"
          test "$server" = "$EXPECTED_POSTGRES"
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          go build ./...
      - if: steps.changed.outputs.run == 'true'
        run: docker build -t noema-core:ci services/core
      - if: steps.changed.outputs.run != 'true'
        run: echo "no services/core change; nothing to build"
