# Live model-selection run (benchmark/decisions/2026-10-27-model-selection.md; REQ-BEN-005, REQ-NFR-007; UND-02).
# workflow_dispatch only. The job declares `environment: bench-live`, which has a required reviewer, so every run waits for the
# founder's approval before any step starts and before the key is exposed. The key is the Environment's secret OPENAI_API_KEY; it is
# passed to one step as an environment variable and is never printed, written to a file or put in an argument.
# Inputs are passed through the environment, never expanded into the script. Linux runner only. The run spends real money: the budget
# guard stops it at $2 (pilot) or $25 (full) counting `prior_spent_micros`, the spending of earlier runs of the same cap, read from
# their printed summaries. Nothing here reads or mounts benchmark-heldout (INV-22).
name: bench-live
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "pilot (cap $2, no verdict) or full (cap $25 in total, every gate)"
        type: choice
        options: [pilot, full]
        required: true
      prior_spent_micros:
        description: "Micro-dollars already spent against the same cap by earlier runs (spent_micros_total of the previous summary); 0 for the first pilot"
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: bench-live
  cancel-in-progress: false
jobs:
  bench-live:
    runs-on: ubuntu-24.04
    environment: bench-live
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install the pinned dependencies
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --require-hashes -r services/model/requirements.lock -r benchmark/requirements.lock
      - name: Run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PHASE: ${{ inputs.phase }}
          PRIOR: ${{ inputs.prior_spent_micros }}
          PYTHONPATH: services/model:.
        run: |
          set -eu
          case "$PRIOR" in ''|*[!0-9]*) echo "prior_spent_micros must be a non-negative integer"; exit 2;; esac
          /tmp/venv/bin/python -m benchmark.bakeoff.live_run --phase "$PHASE" --prior-spent-micros "$PRIOR" --out out
      - name: Summary
        if: always()
        run: |
          if [ -f out/summary.md ]; then cat out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
