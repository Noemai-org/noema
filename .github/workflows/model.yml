# Model service CI (PLT-01). Builds and tests services/model only. Environment: model-ci (DEC-2026-10-13 R3).
name: model
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-24.04
    environment: model-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if git diff --name-only "$base" HEAD | grep -qE '^(services/model/|\.github/workflows/model\.yml)'; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - if: steps.changed.outputs.run == 'true'
        working-directory: services/model
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --require-hashes -r requirements-dev.lock
          /tmp/venv/bin/python -m pytest
          /tmp/venv/bin/python -m mypy
      - if: steps.changed.outputs.run == 'true'
        run: docker build -t noema-model:ci services/model
      - if: steps.changed.outputs.run != 'true'
        run: echo "no services/model change; nothing to build"
