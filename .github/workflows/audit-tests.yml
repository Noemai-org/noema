# Offline tests of the main-merge-audit decision logic. No network, no secrets.
name: audit-tests
on:
  pull_request:
    paths:
      - ".github/workflows/main-merge-audit.yml"
      - ".github/workflows/audit-tests.yml"
      - ".github/scripts/**"
      - ".github/tests/**"
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/tests/**"
permissions:
  contents: read
jobs:
  audit-tests:
    name: audit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run the audit decision tests
        run: node --test .github/tests/main-merge-audit.test.js
