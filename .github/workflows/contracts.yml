# Contracts validation (CON-01): every schema, every fixture, the inventory and the enum drift check.
name: contracts
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # A770 (on A455): the runners are saturated, so a pull request that changes only documentation or status notes skips the heavy jobs below. Push and dispatch runs always run them.
  changed:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.docs_only.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: docs_only
        run: python3 -I tools/ci/docs_only.py "${{ github.event_name }}" "${{ github.event.pull_request.base.sha }}"
  contracts:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: make contracts-validate
