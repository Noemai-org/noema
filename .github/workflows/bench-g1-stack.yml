# The G1 stack run (ENV-04 wiring; noema#441): the bench stack up with Compose, the runner executed INSIDE it on bench_net and edge_net (services/bench-runner.yml), the live mock-case
# log captured for the whole run, and the artifacts uploaded. workflow_dispatch only. It reads no secret and calls no model provider.
#
# It does not make G1 pass. It exists so that when the pieces it waits for exist, the run is one dispatch away. Session tokens are now minted on demand: `make bench-up` makes a
# throw-away SYNTHETIC key pair with the Edge's issuer (`make bench-tokens`, EDG-01), the core mounts the PUBLIC key only and the runner issues each principal's token with the
# private key and the issuer binary, which stay under benchmark/out/idp (mode 0600 in a 0700 directory) and are never uploaded. A run still ends NOT RUN (exit 3) until the core's
# call site reads the stand-in (noema#441) and the write path exists (the G1 card, noema#436). A run that did not run FAILS the job and is never presented as evidence (same rule as
# bench-suites). The held-out set is never mounted or read (INV-22). Inputs reach the shell only through the environment, never expanded into the script, and are validated first.
name: bench-g1-stack
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID to record (letters, digits, dot, dash, underscore; default g1-stack-gh<github run id>)"
        type: string
        default: ""
      max_body_bytes:
        description: "The core's request body limit in bytes (NOEMA_MAX_BODY_BYTES). No default: no value is approved in the repository, so the person who dispatches gives it."
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: bench-g1-stack
  cancel-in-progress: false
jobs:
  g1-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BENCH_MAX_BODY_BYTES: ${{ inputs.max_body_bytes }}
      GIVEN_RUN_ID: ${{ inputs.run_id }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate the inputs
        run: |
          set -eu
          printf '%s' "$GIVEN_RUN_ID" | grep -Eq '^[A-Za-z0-9_.-]{0,64}$' || { echo "run_id must be at most 64 characters of letters, digits, dot, dash and underscore"; exit 2; }
          printf '%s' "$BENCH_MAX_BODY_BYTES" | grep -Eq '^[1-9][0-9]{0,15}$' || { echo "max_body_bytes must be a positive whole number"; exit 2; }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/core/go.mod
          cache-dependency-path: services/core/go.mod
      - name: Start the bench stack (makes the synthetic IdP's key pair and issuer first)
        run: make bench-up
      - id: run
        name: Run the suite in the runner container, capturing mock-case's live log
        env:
          GIVEN_RUN_ID: ${{ inputs.run_id }}
          GITHUB_RUN: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          set +e
          run_id="${GIVEN_RUN_ID:-g1-stack-gh$GITHUB_RUN}"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          export NOEMA_BENCH_OUT="$PWD/benchmark/out" NOEMA_BENCH_UID="$(id -u)" NOEMA_BENCH_GID="$(id -g)" NOEMA_BENCH_MAX_BODY_BYTES="$BENCH_MAX_BODY_BYTES" STANDIN_TENANT_ID=ten_alpha
          compose="docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/bench-model.yml -f deploy/compose/bench-stack.yml --profile bench"
          mkdir -p benchmark/out
          # The runner reads this file during the run (it marks its size before each case and counts refusals after), so it is a live stream, not a copy taken at the end.
          : > benchmark/out/mock-case.log
          # The collector's own errors go to its own file, not to /dev/null, and it is checked below: a collector that never started or died leaves a readable file, and the
          # refusal counters would report zero accesses (Codex P1 on noema#444).
          $compose logs -f --no-log-prefix --since 0s mock-case >> benchmark/out/mock-case.log 2> benchmark/out/mock-case-collector.err &
          logpid=$!
          sleep 2
          collector_dead=0
          kill -0 "$logpid" 2>/dev/null || collector_dead=1
          $compose exec -T bench-runner python -m benchmark.generator generate --seed 20261020 --out /bench-out/suite
          gen=$?
          code=2
          if [ "$gen" -eq 0 ] && [ "$collector_dead" -eq 0 ]; then
            $compose exec -T bench-runner python -m benchmark.runner \
              --suite /bench-out/suite --out /bench-out/run --run-id "$run_id" --commit-sha "$COMMIT" \
              --api-url http://core:8080 \
              --bench-url http://mock-case:8091 --bench-credential-file /creds/mock-case/token \
              --standin-url http://standin:8094 --standin-credential-file /creds/standin/token \
              --proxy-url http://hostility-proxy:8081 --proxy-credential-file /creds/proxy/bench_token \
              --mock-case-log /bench-out/mock-case.log --cost-dir /bench-out/cost --model-writer model-service \
              --idp-binary /bench-out/idp/synthetic-idp --idp-key /bench-out/idp/key/private.pem --idp-kid bench-k1 --idp-audience noema-core \
              --tenant-id ten_alpha
            code=$?
          fi
          # A collector that exited during the run invalidates it: the counters would read an empty or stale file as zero accesses. NOT RUN, never scored.
          kill -0 "$logpid" 2>/dev/null || collector_dead=1
          if [ "$collector_dead" -eq 1 ]; then echo "::error::the mock-case log collector is not running; the refusal counters are not evidence"; fi
          [ "$collector_dead" -eq 1 ] && code=3
          # The scorer decides the result when the run ran (Codex P1 on noema#444). Runner exit 0 or 1 is scored, as `make bench` does; 2 (bad input) and 3 (NOT RUN) are never
          # scored. The scorer exits 0 only when the run is complete and Tier 0 is all zero (SoT 38.3), so that exit becomes the recorded code and a non-zero Tier 0 fails the job.
          if [ "$code" -le 1 ]; then
            $compose exec -T bench-runner python -m benchmark.scoring \
              --cases /bench-out/suite/cases --oracles /bench-out/suite/oracle --results /bench-out/run/results \
              --pack packs/fintech_v1.json --manifest /bench-out/suite/manifest.json --run-id "$run_id" --out /bench-out/score
            score_code=$?
            code="$score_code"
          fi
          sleep 2
          kill "$logpid" 2>/dev/null
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: always()
        env:
          CODE: ${{ steps.run.outputs.code }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          {
            echo "## bench-g1-stack: run id $RUN_ID, exit code $CODE"
            case "$CODE" in
              0) echo "Complete, scored, and Tier 0 is all zero." ;;
              3) echo "**NOT RUN: no access. This is not a pass and not evidence.** The reason is in the run manifest below; nothing was faked. This job fails on purpose." ;;
              1) echo "Ran and was scored, but the run is incomplete or a Tier 0 gate is not at zero. This fails the job." ;;
              *) echo "Failed with exit code $CODE (2: bad input or a missing part of the checkout)." ;;
            esac
            [ -f benchmark/out/run/run-manifest.json ] && { echo; echo '```json'; cat benchmark/out/run/run-manifest.json; echo '```'; }
            [ -f benchmark/out/score/scorecard.json ] && { echo; echo '```json'; cat benchmark/out/score/scorecard.json; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stop the stack
        if: always()
        run: make bench-down
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bench-g1-stack-${{ github.run_id }}
          path: |
            benchmark/out/run/
            benchmark/out/score/
            benchmark/out/mock-case.log
            benchmark/out/mock-case-collector.err
          if-no-files-found: warn
          retention-days: 30
      - name: Result (only a run that ran, complete, passes)
        env:
          CODE: ${{ steps.run.outputs.code }}
        run: |
          case "$CODE" in
            0) exit 0 ;;
            3) echo "::error::The run did not run (exit 3, not run: no access). That is not a pass."; exit 1 ;;
            *) echo "::error::The run ended with exit code $CODE."; exit 1 ;;
          esac
