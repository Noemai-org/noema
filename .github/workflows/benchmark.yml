# Benchmark harness CI (T4 of DEC-2026-10-20, session C): unit, property and CLI tests and mypy --strict.
# Generated layer only. Nothing here reads or mounts benchmark-heldout (INV-22, REQ-AGT-004).
name: benchmark
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if git diff --name-only "$base" HEAD | grep -qE '^(benchmark/|contracts/schemas/(benchmark|arm-manifest)|\.github/workflows/benchmark\.yml)'; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - if: steps.changed.outputs.run == 'true'
        run: make bench-test
      - if: steps.changed.outputs.run != 'true'
        run: echo "no benchmark change; nothing to test"
