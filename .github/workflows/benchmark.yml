# Benchmark harness CI (T4 of DEC-2026-10-20, session C): unit, property and CLI tests and mypy --strict.
# Generated layer only. Nothing here reads or mounts benchmark-heldout (INV-22, REQ-AGT-004).
name: benchmark
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if git diff --name-only "$base" HEAD | grep -qE '^(benchmark/|contracts/schemas/(benchmark|arm-manifest)|\.github/workflows/benchmark\.yml)'; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - if: steps.changed.outputs.run == 'true'
        run: make bench-test
      # BEN-04 (G0-N N10): two generations in two separate processes, compared byte for byte; the summary is the evidence. Only the summary is uploaded: the generated trees hold the oracle documents (INV-22).
      - if: steps.changed.outputs.run == 'true'
        run: make bench-reproduce BENCH_OUT="${{ runner.temp }}/bench-out"
      - if: steps.changed.outputs.run == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generator-reproduce-summary
          path: ${{ runner.temp }}/bench-out/reproduce-summary.txt
          if-no-files-found: warn
          retention-days: 30
      - if: steps.changed.outputs.run != 'true'
        run: echo "no benchmark change; nothing to test"
