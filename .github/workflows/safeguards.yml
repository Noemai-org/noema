# CI safeguards (PLT-02). Runs on every pull request and every push to main.
name: safeguards
on:
  pull_request:
    # edited: a changed description re-runs the PR trace check, and only that check (see the job conditions).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'edited' && 'metadata' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  pull-requests: read
jobs:
  checks:
    # An "edited" event fires for a title, body or base change. Only a body change can alter the PR trace result,
    # so a title-only edit skips the job (a skipped job reports success). Every other step skips on "edited".
    if: github.event.action != 'edited' || github.event.changes.body != null
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install pinned scanners
        if: github.event.action != 'edited'
        run: tools/ci/install_tools.sh "$RUNNER_TEMP/bin"
      # The YAML parser of the two workflow checks (OD-P-95, ruling A283): one hash-pinned wheel, this job only. Without it the checks fail; they never pass unread.
      - name: Install the pinned YAML parser
        if: github.event.action != 'edited'
        run: python3 -m pip install --require-hashes "--only-binary=:all:" --no-deps -r tools/ci/requirements.lock
      # A667 (MEM-02): the regression-link tests below run the real script, which builds the generated suite to see that a linked case exists, so this job needs the benchmark's pinned requirements
      # (jsonschema), hash-checked like the benchmark job's. Without them the check fails (ImportError); it never passes unread.
      - name: Install the benchmark's pinned requirements (the regression-link suite build)
        if: github.event.action != 'edited'
        run: python3 -m pip install --require-hashes -r benchmark/requirements.lock
      # Only the commits of this change: a pull request's commits (base..head) or the commits a push adds. gitleaks's
      # own default scans every ref, so an unrelated branch would fail every pull request. The range is printed.
      - name: Secret scan (gitleaks), the commits of this change only
        if: github.event.action != 'edited'
        env:
          RANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          RANGE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 -I tools/ci/gitleaks_range.py "$RUNNER_TEMP/bin/gitleaks" "$RANGE_BASE" "$RANGE_HEAD"
      - name: Secret scan range tests
        if: github.event.action != 'edited'
        env:
          GITLEAKS: ${{ runner.temp }}/bin/gitleaks
        run: python3 -I tools/ci/test_gitleaks_range.py
      - name: Dependency pins
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/check_pins.py
      - name: Environment references
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/check_env_refs.py
      - name: Secret names (every secret a workflow reads is listed in .env.example)
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/check_secret_refs.py
      - name: Secret-name check tests
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/test_check_secret_refs.py
      - name: Every TEN_RESULT line is checked by a workflow (A274)
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/test_ten_result_grep.py
      - name: Leak scanner tests (SEC-03)
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/test_leakscan.py
      - name: Core test sharding (CI speed)
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/test_go_shards.py
      - name: Workflow concurrency groups (CI speed)
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/test_workflow_concurrency.py
      - name: Regression-link check and its workflow guard (MEM-02)
        if: github.event.action != 'edited'
        # Not -I: these tests import `tools.ci...` from the checkout root (a namespace package), which isolated mode would hide.
        run: python3 -m unittest tools.ci.test_check_regression_link tools.ci.test_regression_link_workflow
      - name: The database image's libsodium download retries and keeps its SHA-256 check (A530)
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/test_pgsodium_dockerfile.py
      - name: Workflow permissions (least privilege, REQ-SEC-007)
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/check_workflow_permissions.py
      - name: Workflow-permission check tests
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/test_check_workflow_permissions.py
      - name: SEC-07 scanners (cross-scope, planted leaks on every surface, the nightly driver)
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/test_scopescan.py && python3 -I tools/ci/test_sec07_nightly.py
      - name: G1 leak scan with a planted canary (noema#436, criterion 8)
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/test_g1_leakscan.py
      - name: The job-log scan's own allow file (noema#899)
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/test_g1_joblog_allow.py
      - name: Compile-acceptance workflow guard (noema#546)
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/test_bench_live_compile.py
      - name: The harness configuration is fixed in every workflow, Compose and env file (A362)
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/test_harness_selection_is_closed.py
      - name: The runner parsers refuse an abbreviated flag (A362)
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/test_runner_parsers_refuse_abbreviations.py
      - name: Administrator credential absent from workflows (SEC-02)
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/check_no_admin_in_workflows.py
      - name: Administrator-credential check tests
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/test_check_no_admin_in_workflows.py
      - name: No checkout leaves the job token on disk (PLT-05)
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/check_checkout_credentials.py
      - name: Checkout-credential check tests
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/test_check_checkout_credentials.py
      - name: PR trace
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        # Read the live description, not the event payload: a re-run replays the payload of the
        # original event, so an edited description would never be seen.
        run: |
          body="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.body // ""')"
          PR_BODY="$body" python3 -I tools/ci/check_pr_trace.py
      - name: PR template and its guard (AGT-01, REQ-AGT-003)
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/test_pr_template.py && python3 -I tools/ci/test_safeguards_agt01.py
      - name: Vendored-copy script tests (the current PERD is resolved, not hardcoded)
        if: github.event.action != 'edited'
        run: python3 -I -m unittest discover -s tools/vendor -p 'test_*.py'
      - name: Canaries (each check must fail for its own reason)
        if: github.event.action != 'edited'
        run: python3 -I tools/ci/run_canaries.py "$RUNNER_TEMP/bin/gitleaks"
  images:
    if: github.event.action != 'edited'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: core
            context: services/core
          - service: model
            context: services/model
          - service: ui
            context: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned scanners
        run: tools/ci/install_tools.sh "$RUNNER_TEMP/bin"
      - name: Build image from its own context
        run: docker build -t noema-${{ matrix.service }}:ci ${{ matrix.context }}
      - name: Image file-list check (R2)
        run: python3 -I tools/ci/check_image_files.py ${{ matrix.service }} --image noema-${{ matrix.service }}:ci
      - name: CycloneDX SBOM
        run: "$RUNNER_TEMP/bin/syft noema-${{ matrix.service }}:ci -o cyclonedx-json=sbom-${{ matrix.service }}.cdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json
  codegen-diff:
    # CON-03 (REQ-API-001, AGENT-15): regenerate the Go and Pydantic types from contracts/schemas and fail on any difference, on any
    # file added by hand to a generated directory, and on a generator that does not pass its own tests. gofmt comes with Go.
    if: github.event.action != 'edited'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/core/go.mod
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: make codegen-check
