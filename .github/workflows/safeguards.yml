# CI safeguards (PLT-02). Runs on every pull request and every push to main.
name: safeguards
on:
  pull_request:
    # edited: a changed description re-runs the PR trace check.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install pinned scanners
        run: tools/ci/install_tools.sh "$RUNNER_TEMP/bin"
      # Only the commits of this change: a pull request's commits (base..head) or the commits a push adds. gitleaks's
      # own default scans every ref, so an unrelated branch would fail every pull request. The range is printed.
      - name: Secret scan (gitleaks), the commits of this change only
        env:
          RANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          RANGE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 -I tools/ci/gitleaks_range.py "$RUNNER_TEMP/bin/gitleaks" "$RANGE_BASE" "$RANGE_HEAD"
      - name: Secret scan range tests
        env:
          GITLEAKS: ${{ runner.temp }}/bin/gitleaks
        run: python3 -I tools/ci/test_gitleaks_range.py
      - name: Dependency pins
        run: python3 -I tools/ci/check_pins.py
      - name: Environment references
        run: python3 -I tools/ci/check_env_refs.py
      - name: Secret names (every secret a workflow reads is listed in .env.example)
        run: python3 -I tools/ci/check_secret_refs.py
      - name: Secret-name check tests
        run: python3 -I tools/ci/test_check_secret_refs.py
      - name: PR trace
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        # Read the live description, not the event payload: a re-run replays the payload of the
        # original event, so an edited description would never be seen.
        run: |
          body="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.body // ""')"
          PR_BODY="$body" python3 -I tools/ci/check_pr_trace.py
      - name: Vendored-copy script tests (the current PERD is resolved, not hardcoded)
        run: python3 -I -m unittest discover -s tools/vendor -p 'test_*.py'
      - name: Canaries (each check must fail for its own reason)
        run: python3 -I tools/ci/run_canaries.py "$RUNNER_TEMP/bin/gitleaks"
  images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: core
            context: services/core
          - service: model
            context: services/model
          - service: ui
            context: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned scanners
        run: tools/ci/install_tools.sh "$RUNNER_TEMP/bin"
      - name: Build image from its own context
        run: docker build -t noema-${{ matrix.service }}:ci ${{ matrix.context }}
      - name: Image file-list check (R2)
        run: python3 -I tools/ci/check_image_files.py ${{ matrix.service }} --image noema-${{ matrix.service }}:ci
      - name: CycloneDX SBOM
        run: "$RUNNER_TEMP/bin/syft noema-${{ matrix.service }}:ci -o cyclonedx-json=sbom-${{ matrix.service }}.cdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json
  codegen-diff:
    # Disabled. CON-03 enables it: regenerate types from contracts/ and fail on any diff.
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: echo "enabled by CON-03"
