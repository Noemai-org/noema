# SEC-14 spike (test infrastructure only; nothing is adopted). Runs checks A1 to A7 of docs/security/sec-14-anchor-store-evaluation.md
# against a candidate write-once anchor store in a throwaway container with only the S3 port published to localhost.
# Runs only on a pull request that changes these paths, or by hand (workflow_dispatch); never on every PR or push.
# No secrets are read and no environment is used. All keys are SYNTHETIC and are in the repository on purpose.
name: anchor-store-spike
on:
  pull_request:
    paths: ['deploy/spike/anchor-store/**', '.github/workflows/anchor-store-spike.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        store: [seaweedfs]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run A1 to A7 on ${{ matrix.store }}
        run: deploy/spike/anchor-store/run.sh ${{ matrix.store }}
