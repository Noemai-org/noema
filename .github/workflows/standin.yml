# Stand-in CI (ENV-05). Builds and tests synthetic/standin only, the Noema-side stand-in for the Tushe-held data. No GitHub Environment: it needs no
# secret. The workflow always triggers so its check always reports; the path filter runs inside the job.
name: standin
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  standin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if git diff --name-only "$base" HEAD | grep -qE '^(synthetic/standin/|deploy/compose/services/standin|\.github/workflows/standin\.yml)'; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: synthetic/standin/go.mod
          cache: false
      - if: steps.changed.outputs.run == 'true'
        working-directory: synthetic/standin
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
          go build ./...
      - if: steps.changed.outputs.run == 'true'
        run: docker build -t noema-standin:ci synthetic/standin
      - if: steps.changed.outputs.run != 'true'
        run: echo "no synthetic/standin change; nothing to build"
