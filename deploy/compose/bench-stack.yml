# Bench startup only (ENV-04 wiring; noema#441; ruling A135): the bench stack's wiring on top of docker-compose.yml and bench-model.yml: the core's settings for reading the
# Noema-side stand-in through the hostility proxy, and the runner's output directory.
# NOT included by docker-compose.yml. `make bench-up` adds it with `-f` (after bench-model.yml); `make up`, the dev, ci and demo profiles never do, so nothing here is in any other stack.
#
# What it does:
#   - the hostility proxy loads the stand-in route table (routes.standin.json), so the core's reads of the stand-in pass the proxy and are in its per-route request log
#     (the source of monetary_calls) and can be faulted by a FaultPlan (AGENT-12);
#   - the core gets the settings its stand-in read adapter will need: the data URL (the proxy's data side on tushe_net), the tenant, and the file-mounted runtime credential
#     and principal key. The tenant is the stand-in's own (STANDIN_TENANT_ID): the adapter's assertion names it and an answer for another tenant is refused (A135).
#   - the core holds only the runtime credential and the principal key, never the bench credential: the key that loads never reads (REQ-ENV-002).
#
# Honest status: nothing in the core reads these settings yet. `services/core/cmd/core` serves /healthz and /readyz only, and the read call site (the evidence read inside the
# investigation, with the Scope built from the authenticated session, INV-12) belongs to the Evidence Layer and the Edge (noema#441). The names below are the contract that
# call site is to use; until it exists a G1 run ends NOT RUN.
volumes:
  # The Trust login DSN files the core loads: written once by trust-dsn-init at mode 0400 owned by the core's user (A356, INV-29). Only that step writes it; only the core mounts it, read-only.
  trust_dsns: {}
  # The other three DSN directories, the two signing-key directories and the input hash key (A506, interim, from the code): each written once by a one-shot at mode 0400 owned by the core's user
  # (INV-29). Only that step writes it; only the core mounts it, read-only. One directory per identity: the loader reads every key file of its directory.
  orchestrator_dsns: {}
  record_read_dsns: {}
  edge_dsns: {}
  orchestrator_keys: {}
  edge_keys: {}
  input_hash: {}
  # The Execution side's two logins and two signing-key directories (A554, A564; lane 5): each written once by its one-shot at mode 0400 owned by the core's user, read-only in the core and nowhere else.
  # Execution and Outcome keys stay apart (A564): one directory per identity, as the loader reads every key file of its directory.
  execution_dsns: {}
  outcome_dsns: {}
  execution_keys: {}
  outcome_keys: {}
  # The operator DSN (the superuser's, A527) and the core-trust signing key (A445): each written once by its one-shot at mode 0400 owned by uid 65532. The DSN is read by tenant-init only; the key
  # directory by tenant-init and policy-publish only, read-only. The core mounts neither.
  operator_dsn: {}
  core_trust_keys: {}
# The three key values (secrets_local.sh makes them; 64 lower-case hexadecimal characters each). Held by the core-keys-init one-shot ONLY.
secrets:
  core_workflows_ed25519_seed_1:
    file: ./secrets/core_workflows_ed25519_seed_1
  core_edge_ed25519_seed_1:
    file: ./secrets/core_edge_ed25519_seed_1
  input_hash_key:
    file: ./secrets/input_hash_key
  # The receipt signer's seed (identity core-execution) and the Outcome verdict signer's seed (identity core-outcome), A554 and A564. Held by core-keys-init only.
  core_execution_ed25519_seed_1:
    file: ./secrets/core_execution_ed25519_seed_1
  core_outcome_ed25519_seed_1:
    file: ./secrets/core_outcome_ed25519_seed_1
  # The migration password's private copy (A536): the same value as noema_migrator_password, mode 0400, owned by the host user. Held by the two one-shots that hold the migration password (migrate and
  # tenants-provision), which run as that user; postgres reads the mode-644 original.
  migrator_password_file:
    file: ./secrets/migrator_password_file
  # The core-trust Ed25519 seed (A445, interim; secrets_local.sh makes it). Held by the core-trust-keys-init one-shot ONLY.
  core_trust_ed25519_seed_1:
    file: ./secrets/core_trust_ed25519_seed_1
services:
  core:
    environment:
      NOEMA_STANDIN_URL: "http://hostility-proxy:8080"
      NOEMA_STANDIN_TENANT_ID: "${STANDIN_TENANT_ID:-ten_alpha}"
      NOEMA_STANDIN_RUNTIME_TOKEN_FILE: /run/standin/runtime/token
      NOEMA_STANDIN_PRINCIPAL_KEY_FILE: /run/standin/principal/key
      # The session settings of the protected /v1 API (EDG-01; all six or none, no defaults, AGENT-16): the synthetic IdP's PUBLIC key under its key id, the audience, the one tenant,
      # the pack's session limits, and the body limit, which a person gives at dispatch (no value is approved in the repository). `make bench-tokens` makes the key pair under
      # $NOEMA_BENCH_OUT/idp: the core mounts the public key only, never the private key or the issuer binary, which only the runner reads.
      NOEMA_SESSION_PUBLIC_KEY_FILE: /run/idp/public.pem
      NOEMA_SESSION_KID: "${BENCH_KID:-bench-k1}"
      NOEMA_SESSION_AUDIENCE: "${BENCH_AUDIENCE:-noema-core}"
      NOEMA_SESSION_TENANTS: "${STANDIN_TENANT_ID:-ten_alpha}"
      NOEMA_SESSION_LIMITS_FILE: /run/idp/session_limits.json
      NOEMA_MAX_BODY_BYTES: "${NOEMA_BENCH_MAX_BODY_BYTES:?set by make bench-up from BENCH_MAX_BODY_BYTES}"
      # The most bytes the core reads of one evidence payload (noema#606). No default in the core (AGENT-16): this number is the Architect's, ruling A236 (interim, relayed; docs#187),
      # for the bench profile only and provisional; a production value goes through an [OPEN] entry. The core reads it only when its Trust-login DSN directory is set.
      NOEMA_PAYLOAD_MAX_BYTES: "262144"
      # The five bounds of the injection detector (STM-01; A704, interim, relayed, not yet committed). No default in the core (AGENT-16, A330): these numbers are the Architect's, for the bench profile
      # only. 64 patterns, 1024 bytes per pattern, 65536 bytes for the pattern document, nesting depth 8, a field cap of 256 characters. Absent, the screen is a named gap on /readyz.
      NOEMA_INJECTION_MAX_PATTERNS: "64"
      NOEMA_INJECTION_MAX_PATTERN_BYTES: "1024"
      NOEMA_INJECTION_MAX_DOCUMENT_BYTES: "65536"
      NOEMA_INJECTION_MAX_DEPTH: "8"
      NOEMA_INJECTION_FIELD_CAP: "256"
      # The evidence login (A722, A594; docs/decisions/DEC-2026-11-26-architect-rulings-a721-a737.md): the DSN directory follows the existing per-tenant DSN-directory pattern; the key overlap is 2.
      # NOEMA_EVIDENCE_KEY_FILE has no value here: no ruling names the path of the core-evidence key file (IL provisions it, A536), so the screen is a named gap on /readyz until it is set.
      NOEMA_EVIDENCE_DSN_DIR: /run/evidence-dsn
      NOEMA_EVIDENCE_KEY_MAX_ACTIVE: "2"
      # The bench settings with no default in code (A356, interim, relayed; docs/decisions/DEC-2026-11-19-architect-rulings-a341-a357.md): the Architect's values, for the bench profile only. They collect
      # the settings of A319, A320, A330 and A345; a setting the core does not read yet is inert until its lane merges. Changing a number here is a ruling, not an edit (AGENT-16).
      NOEMA_STORE_TIMEOUT_MS: "1000"
      NOEMA_SEAL_TIMEOUT_MS: "1000"
      NOEMA_COMPILE_TIMEOUT_MS: "3000"
      NOEMA_READ_TIMEOUT_MS: "2000"
      NOEMA_TRUST_DB_TIMEOUT_MS: "1000"
      NOEMA_TRUST_RECONCILE_TIMEOUT_MS: "1000"
      NOEMA_GRANT_KEY_MAX_ACTIVE: "2"
      NOEMA_DB_SERIALIZATION_ATTEMPTS: "3"
      NOEMA_OUTBOX_INTERVAL_MS: "1000"
      # The three paths. The grant keys are the grant_keys volume of docker-compose.yml (written by grant-keys-init, SEC-09); the pack is the repository's packs folder, read-only; the Trust logins
      # are the trust_dsns volume below (one file per tenant, written by trust-dsn-init), so the core never holds the tenant login password as a secret of its own.
      NOEMA_GRANT_KEY_DIR: /run/grant-keys
      NOEMA_PACK_DIR: /run/packs
      NOEMA_TRUST_DSN_DIR: /run/trust-dsn
      # The pack's manifest (relative to the pack directory) and the bounds of the pack loader (A445, interim, relayed): the Architect's bench values, no default in code (AGENT-16).
      NOEMA_PACK_MANIFEST: fintech/manifest.v1.json
      NOEMA_PACK_MAX_BYTES: "1048576"
      NOEMA_PACK_MAX_DEPTH: "32"
      # The gateway, worker and recovery settings (A477, interim, relayed; docs#213): the Architect's bench values, Compose only, no default in code (AGENT-16). Durations are Go durations. Workers is 1
      # because the model service's pool is 6 and one pipeline uses 5 in flight (a second concurrent pipeline would be refused locally). The loaders refuse ACTIVITY_TIMEOUT <= RUN_TIMEOUT and
      # RECOVERY_IDLE <= RUN_TIMEOUT, so a live run cannot be picked up twice; netcheck checks the same ordering in the table.
      NOEMA_INPUT_DEDUP_WINDOW: "5m"
      NOEMA_INPUT_RECORD_TIMEOUT: "5s"
      NOEMA_INVESTIGATION_QUEUE: "64"
      NOEMA_INVESTIGATION_WORKERS: "1"
      NOEMA_INVESTIGATION_RUN_TIMEOUT_MS: "180000"
      NOEMA_INVESTIGATION_START_TIMEOUT_MS: "30000"
      NOEMA_EDGE_KEY_MAX_ACTIVE: "2"
      NOEMA_TEMPORAL_ACTIVITY_TIMEOUT_MS: "240000"
      NOEMA_TEMPORAL_SHUTDOWN_DRAIN_MS: "30000"
      NOEMA_STM_RECOVERY_IDLE_MS: "240000"
      NOEMA_STM_RECOVERY_BATCH_SIZE: "50"
      # A506 (interim, from the code at the heads of noema#838, main and noema#847): the DSN directories (one file per tenant named by the tenant id: `record_read__<t>`, `orchestrator_rw__<t>` and
      # `record_emitter__<t>__core-edge`), the key directories (`core-workflows.ed25519.1.key` and `core-edge.ed25519.1.key`, 64 hex, 0400, owned by uid 65532) and the input hash key file. The
      # Temporal values: the namespace auto-setup creates, the queue the worker and the starter both read, the CA only (server-side TLS, DEBT-46: the client certificate and key stay unset).
      # The Recorder's lifetimes are EL's values in noema#847's body (the PERD's 10 minutes for the grant, equal for the record, A475's 10 s for the transaction; the Founder confirms): the grant
      # lifetime must not exceed the record lifetime. NOEMA_WRITE_SWAP_DECISIONS is a test-only switch and is never a Compose setting.
      NOEMA_RECORD_READ_DSN_DIR: /run/record-read-dsn
      NOEMA_ORCHESTRATOR_DSN_DIR: /run/orchestrator-dsn
      NOEMA_EDGE_DSN_DIR: /run/edge-dsn
      NOEMA_ORCHESTRATOR_KEY_DIR: /run/orchestrator-keys
      NOEMA_EDGE_KEY_DIR: /run/edge-keys
      NOEMA_INPUT_HASH_KEY_FILE: /run/input-hash/key
      NOEMA_ORCHESTRATOR_KEY_MAX_ACTIVE: "2"
      # A554 and A564 (lane 5, C1's noema#917): the Execution side's two logins (one file per tenant: `execution_rw__<t>` and `outcome_rw__<t>`) and the receipt signer's and the Outcome verdict
      # signer's key directories (`core-execution.ed25519.1.key`, `core-outcome.ed25519.1.key`; 64 hex, 0400, owner 65532). The overlaps mirror the orchestrator's and the edge's (A506): no ruling
      # gives a number for these two, so 2 is the same rotation overlap, pinned by netcheck so a change is visible; the Architect confirms it. The core reads these when lane 5 lands (the setting is inert until then).
      NOEMA_EXECUTION_DSN_DIR: /run/execution-dsn
      NOEMA_OUTCOME_DSN_DIR: /run/outcome-dsn
      NOEMA_EXECUTION_KEY_DIR: /run/execution-keys
      NOEMA_EXECUTION_KEY_MAX_ACTIVE: "2"
      NOEMA_OUTCOME_KEY_DIR: /run/outcome-keys
      NOEMA_OUTCOME_KEY_MAX_ACTIVE: "2"
      # A714 (interim; docs/decisions/DEC-2026-11-26-architect-rulings-a704-a720.md), bench only, resource limits and timeouts, no default in code (AGENT-16). The events route's eight settings
      # are A658's table; a missing or out-of-range one fails the start. The Execution timeouts are execute 10000 and rollback 5000 (ms); the plan text bound is 256 bytes (A705).
      NOEMA_EVENTS_POLL_MS: "2000"
      NOEMA_EVENTS_MAX_STREAM_MS: "300000"
      NOEMA_EVENTS_WRITE_TIMEOUT_MS: "5000"
      NOEMA_EVENTS_READ_TIMEOUT_MS: "2000"
      NOEMA_EVENTS_MAX_EVENT_BYTES: "65536"
      NOEMA_EVENTS_MAX_STREAMS: "100"
      NOEMA_EVENTS_MAX_STREAMS_PER_PRINCIPAL: "3"
      NOEMA_EVENTS_MAX_BATCH: "100"
      NOEMA_EXECUTION_EXECUTE_TIMEOUT_MS: "10000"
      NOEMA_EXECUTION_ROLLBACK_TIMEOUT_MS: "5000"
      NOEMA_PLAN_TEXT_MAX_BYTES: "256"
      NOEMA_TEMPORAL_NAMESPACE: default
      NOEMA_TEMPORAL_TASK_QUEUE: noema-investigations
      NOEMA_TEMPORAL_TLS_CA_FILE: /run/tls/ca.crt
      NOEMA_TRUST_ESCALATION_GRAPH: fin.graph.escalate
      NOEMA_TRUST_GRANT_LIFETIME_MS: "600000"
      NOEMA_TRUST_RECORD_LIFETIME_MS: "600000"
      NOEMA_TRUST_TX_TIMEOUT_MS: "10000"
    volumes:
      - ../../packs:/run/packs:ro
      - trust_dsns:/run/trust-dsn:ro
      - record_read_dsns:/run/record-read-dsn:ro
      - orchestrator_dsns:/run/orchestrator-dsn:ro
      - edge_dsns:/run/edge-dsn:ro
      - orchestrator_keys:/run/orchestrator-keys:ro
      - edge_keys:/run/edge-keys:ro
      - execution_dsns:/run/execution-dsn:ro
      - outcome_dsns:/run/outcome-dsn:ro
      - execution_keys:/run/execution-keys:ro
      - outcome_keys:/run/outcome-keys:ro
      - input_hash:/run/input-hash:ro
      - standin_runtime_credential:/run/standin/runtime:ro
      - standin_principal_key:/run/standin/principal:ro
      - ${NOEMA_BENCH_OUT:?set by make bench-up}/idp/key/public.pem:/run/idp/public.pem:ro
      - ../../packs/fintech/limits/session_limits.json:/run/idp/session_limits.json:ro
    depends_on:
      trust-dsn-init:
        condition: service_completed_successfully
      core-keys-init:
        condition: service_completed_successfully
      policy-publish:
        condition: service_completed_successfully
      hostility-proxy:
        condition: service_healthy
      standin:
        condition: service_healthy
  # One-shot, as root, no network (A356): turns the tenant login password secret and the tenant list into the per-tenant Trust login DSN files the core reads (mode 0400, owner 65532), and checks
  # each by reading it as that user. It prints file names, never a password. If it fails the core does not start. The tenant list is the one postgres creates logins for, so the two cannot differ.
  trust-dsn-init:
    image: python:3.13.16-slim-bookworm@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641
    profiles: [bench]
    user: "0:0"
    network_mode: none
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    # Only what the step does: CHOWN and FOWNER (give the file to the core's user, then set its mode after it is no longer the step's own), SETUID and SETGID (read each file back as that user).
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID]
    environment:
      TRUST_DSN_SRC: /run/secrets
      TRUST_DSN_EMITTERS: /run/emitter_logins
      # one job per directory of the core (A506): the group and the volume's path inside this step
      TRUST_DSN_JOBS: "trust_rw:/out/trust orchestrator_rw:/out/orchestrator record_read:/out/record-read edge:/out/edge execution_rw:/out/execution outcome_rw:/out/outcome"
      TRUST_DSN_UID: "65532"
      TRUST_DSN_GID: "65532"
      TRUST_DSN_TENANTS: "${NOEMA_TENANTS:-${STANDIN_TENANT_ID:-ten_alpha}}"
    command: ["python3", "-I", "/init/init.py"]
    secrets: [noema_tenant_login_password]
    volumes:
      - ./trust-dsn/init.py:/init/init.py:ro
      - trust_dsns:/out/trust
      - orchestrator_dsns:/out/orchestrator
      - record_read_dsns:/out/record-read
      - edge_dsns:/out/edge
      - execution_dsns:/out/execution
      - outcome_dsns:/out/outcome
      # the core-edge login's own secret, one file per tenant (ruling A4); read-only, held by postgres and by this step only
      - ./secrets/emitter_logins:/run/emitter_logins:ro
  # One-shot, as root, no network (A506): turns the three key secrets into the files the core loads (64 hexadecimal characters, mode 0400, owner 65532) and checks each by reading it as that user. It prints
  # file names, never a value. If it fails the core does not start.
  core-keys-init:
    image: python:3.13.16-slim-bookworm@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641
    profiles: [bench]
    user: "0:0"
    network_mode: none
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # The three key secrets are files that keep the host user's ownership and mode 0600 (Compose bind-mounts them as they are), so uid 0 with no capability cannot read them: DAC_READ_SEARCH reads any file
    # and writes none (Codex P1 on noema#874). CHOWN and FOWNER give the written file to the core's user and set its mode; SETUID and SETGID read it back as that user. Never DAC_OVERRIDE.
    cap_add: [CHOWN, DAC_READ_SEARCH, FOWNER, SETUID, SETGID]
    environment:
      CORE_KEYS_SRC: /run/secrets
      CORE_KEYS_FILES: "core_workflows_ed25519_seed_1=/out/orchestrator/core-workflows.ed25519.1.key core_edge_ed25519_seed_1=/out/edge/core-edge.ed25519.1.key input_hash_key=/out/input-hash/key core_execution_ed25519_seed_1=/out/execution/core-execution.ed25519.1.key core_outcome_ed25519_seed_1=/out/outcome/core-outcome.ed25519.1.key"
      CORE_KEYS_UID: "65532"
      CORE_KEYS_GID: "65532"
    command: ["python3", "-I", "/init/init.py"]
    secrets: [core_workflows_ed25519_seed_1, core_edge_ed25519_seed_1, input_hash_key, core_execution_ed25519_seed_1, core_outcome_ed25519_seed_1]
    volumes:
      - ./core-keys/init.py:/init/init.py:ro
      - orchestrator_keys:/out/orchestrator
      - edge_keys:/out/edge
      - input_hash:/out/input-hash
      - execution_keys:/out/execution
      - outcome_keys:/out/outcome
  # One-shot, as root, no network (A527): turns the superuser's password secret into the one DSN file tenant-init reads (mode 0400, owner 65532). The migration login's password is not here: it belongs to
  # the migrate one-shot and postgres alone. It prints the file name, never the password. If it fails, tenant-init does not run.
  operator-dsn-init:
    image: python:3.13.16-slim-bookworm@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641
    profiles: [bench]
    user: "0:0"
    network_mode: none
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    # The same capabilities as trust-dsn-init: CHOWN and FOWNER give the file to the core's user and set its mode; SETUID and SETGID read it back as that user. The secret is read through its mode
    # (secrets_local.sh keeps the password secrets at 644 for postgres), so no read capability is needed.
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID]
    environment:
      OPERATOR_DSN_SRC: /run/secrets
      OPERATOR_DSN_OUT: /out
      OPERATOR_DSN_UID: "65532"
      OPERATOR_DSN_GID: "65532"
    command: ["python3", "-I", "/init/init.py"]
    secrets: [postgres_superuser_password]
    volumes:
      - ./operator-dsn/init.py:/init/init.py:ro
      - operator_dsn:/out
  # One-shot (A484, A521, A536): applies the migrations as the migration login and exits. From the core image under its own entrypoint, on data_net only, as the host user that owns the password file (cmd/migrate
  # refuses a password file that is not mode 0400 and owned by the user it runs as), with a read-only root, a tmpfs and no capability. The connection is built from flags and the password FILE (never an argument,
  # never the environment): host postgres, port 5432, database noema, the migration login, sslmode prefer (the default; the other logins' DSN files name none). One of the two holders of the migration
  # password (A536); it holds nothing else. tenants-create, tenants-provision, tenant-init and policy-publish wait for it: key_register and the policy tables exist only after the migrations.
  migrate:
    image: noema-core:dev
    profiles: [bench]
    user: "${NOEMA_BENCH_UID:?set by make bench-up}:${NOEMA_BENCH_GID:?set by make bench-up}"
    networks: [data_net]
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=1m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["--host", "postgres", "--port", "5432", "--database", "noema", "--user", "noema_migration_login", "--password-file", "/run/secrets/migrator_password_file", "--sslmode", "prefer", "--migrations-dir", "/migrations"]
    secrets: [migrator_password_file]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../services/core/migrations:/migrations:ro
  # One-shot, as root, no network (A445): turns the core-trust seed into core-trust.ed25519.1.key (64 hexadecimal characters, mode 0400, owner 65532), the form execution/signing.LoadRing reads, and checks it
  # by reading it as that user. The seed keeps the host user's mode 0600, so DAC_READ_SEARCH (reads, writes nothing) as for core-keys-init; never DAC_OVERRIDE. It is the same script as core-keys-init.
  core-trust-keys-init:
    image: python:3.13.16-slim-bookworm@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641
    profiles: [bench]
    user: "0:0"
    network_mode: none
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, FOWNER, SETUID, SETGID]
    environment:
      CORE_KEYS_SRC: /run/secrets
      CORE_KEYS_FILES: "core_trust_ed25519_seed_1=/out/core-trust/core-trust.ed25519.1.key"
      CORE_KEYS_UID: "65532"
      CORE_KEYS_GID: "65532"
    command: ["python3", "-I", "/init/init.py"]
    secrets: [core_trust_ed25519_seed_1]
    volumes:
      - ./core-keys/init.py:/init/init.py:ro
      - core_trust_keys:/out/core-trust
  # One-shot (A353, A489): creates the tenant rows (the one creator of a tenant row), as the operator's SUPERUSER, which is the only role that may insert one (row-level security on `tenant`). It runs the
  # repository's create-tenants.sh from the database image (psql; no new image) as 65532 on data_net only. The script takes its connection from libpq's settings and passes no password: PGPASSFILE names the
  # one-line `pgpass` file operator-dsn-init wrote. The environment names paths and tenants, never a password.
  tenants-create:
    image: noema-postgres:dev
    profiles: [bench]
    user: "65532:65532"
    networks: [data_net]
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=1m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "/scripts/create-tenants.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: noema
      PGUSER: postgres
      PGPASSFILE: /run/operator-dsn/pgpass
      NOEMA_TENANTS: "${NOEMA_TENANTS:-${STANDIN_TENANT_ID:-ten_alpha}}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      operator-dsn-init:
        condition: service_completed_successfully
    volumes:
      - ./postgres/create-tenants.sh:/scripts/create-tenants.sh:ro
      - operator_dsn:/run/operator-dsn:ro
  # One-shot (DEBT-04, A536, A540; provision-tenants.sh): maps each tenant's logins to the tenant and the powers, as the MIGRATION login, the one login that holds EXECUTE on provision_tenant_login and
  # provision_emitter_login today. It runs no DDL (see the PR for every statement). From the database image, as the host user that owns the password file, with a read-only root, a tmpfs and no
  # capability, on data_net only. It is the second holder of the migration password (A536): the wrapper writes the one-line libpq password file into the tmpfs (mode 0600, this user's) from the private copy;
  # the password is in no argument and no environment variable, and is printed nowhere. It runs after the tenant rows exist.
  tenants-provision:
    image: noema-postgres:dev
    profiles: [bench]
    user: "${NOEMA_BENCH_UID:?set by make bench-up}:${NOEMA_BENCH_GID:?set by make bench-up}"
    networks: [data_net]
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=1m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint:
      - /bin/sh
      - -c
      - "umask 077; { printf 'postgres:5432:noema:noema_migration_login:'; cat /run/secrets/migrator_password_file; } > /tmp/pgpass && exec sh /scripts/provision-tenants.sh"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: noema
      PGUSER: noema_migration_login
      PGPASSFILE: /tmp/pgpass
      NOEMA_TENANTS: "${NOEMA_TENANTS:-${STANDIN_TENANT_ID:-ten_alpha}}"
      NOEMA_EMITTERS: "${NOEMA_EMITTERS:-core-edge}"
    secrets: [migrator_password_file]
    depends_on:
      tenants-create:
        condition: service_completed_successfully
    volumes:
      - ./postgres/provision-tenants.sh:/scripts/provision-tenants.sh:ro
  # One-shot (A484, A489): registers the core-trust PUBLIC key in signing_key (key_register) and creates no tenant row. It runs from the core image under its own entrypoint, as the image's nonroot user,
  # on data_net only, with the superuser DSN file and the key directory read-only. There is no --tenant: tenant rows have one creator, create-tenants.sh. It prints two counts, never a key.
  tenant-init:
    image: noema-core:dev
    profiles: [bench]
    user: "65532:65532"
    networks: [data_net]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/usr/local/bin/tenantinit"]
    command: ["--dsn-file", "/run/operator-dsn/dsn", "--key-dir", "/run/core-trust-keys", "--key-max-active", "1"]
    depends_on:
      postgres:
        condition: service_healthy
      tenants-provision:
        condition: service_completed_successfully
      operator-dsn-init:
        condition: service_completed_successfully
      core-trust-keys-init:
        condition: service_completed_successfully
    volumes:
      - operator_dsn:/run/operator-dsn:ro
      - core_trust_keys:/run/core-trust-keys:ro
  # One-shot (A445): publishes the pack's policy for the bench tenant, signed by core-trust and recorded as POLICY_PUBLISHED, so the Trust intake finds a policy in force. It runs from the core image
  # under its own entrypoint, as nonroot, on data_net only, with the tenant's Trust login DSN file and the key directory read-only. It runs after tenant-init (the public key must be registered) and the
  # core waits for it. The publisher is the database role of the DSN (A474); there is no --published-by.
  policy-publish:
    image: noema-core:dev
    profiles: [bench]
    user: "65532:65532"
    networks: [data_net]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/usr/local/bin/policypublish"]
    command:
      - --tenant
      - "${STANDIN_TENANT_ID:-ten_alpha}"
      - --pack-dir
      - /run/packs
      - --pack-file
      - fintech_v1.json
      - --dsn-file
      - "/run/trust-dsn/${STANDIN_TENANT_ID:-ten_alpha}"
      - --key-dir
      - /run/core-trust-keys
      - --key-max-active
      - "1"
    depends_on:
      postgres:
        condition: service_healthy
      trust-dsn-init:
        condition: service_completed_successfully
      tenant-init:
        condition: service_completed_successfully
    volumes:
      - ../../packs:/run/packs:ro
      - trust_dsns:/run/trust-dsn:ro
      - core_trust_keys:/run/core-trust-keys:ro
  postgres:
    environment:
      NOEMA_TENANTS: "${NOEMA_TENANTS:-${STANDIN_TENANT_ID:-ten_alpha}}"
  hostility-proxy:
    environment:
      HOSTILITY_PROXY_ROUTES_FILE: /etc/hostility-proxy/config/routes.standin.json
  # Temporal serves server-side TLS in the bench profile (A296, interim; NO client authentication and not mTLS: DEBT-46): the frontend presents the stack's `temporal` certificate, so a plain client is refused (EL's "refuse plain" test follows this).
  # The names are the ones of the pinned image's config template (docker/config_template.yaml, release 1.29.7): TEMPORAL_TLS_FRONTEND_CERT and _KEY are the server certificate;
  # TEMPORAL_TLS_SERVER_CA_CERT and TEMPORAL_TLS_FRONTEND_SERVER_NAME are what the in-process worker trusts and verifies when it dials the frontend; TEMPORAL_TLS, TEMPORAL_TLS_CA and
  # TEMPORAL_TLS_SERVER_NAME are read by the image's `temporal` CLI (its default-namespace set-up and the healthcheck below) and are not the server's names.
  # What this is NOT: client authentication. The frontend does not require a client certificate (TEMPORAL_TLS_REQUIRE_CLIENT_AUTH stays false): with it the combined auto-setup server's
  # own worker would need a client certificate its template cannot give it, and the clean answer is an internal-frontend split, which is a decision for EL and the Architect, not a setting here.
  temporal:
    environment:
      TEMPORAL_TLS_FRONTEND_CERT: /run/tls/temporal.crt
      TEMPORAL_TLS_FRONTEND_KEY: /run/tls/temporal.key
      TEMPORAL_TLS_SERVER_CA_CERT: /run/tls/ca.crt
      TEMPORAL_TLS_FRONTEND_SERVER_NAME: temporal
      # The internode listeners present the same certificate: in the pinned template TEMPORAL_TLS_SERVER_CA_CERT is also the root of the internode client, so without a
      # matching server certificate the services could not dial each other (Codex P1 on noema#698). Server-side TLS only, no client authentication (DEBT-46).
      TEMPORAL_TLS_SERVER_CERT: /run/tls/temporal.crt
      TEMPORAL_TLS_SERVER_KEY: /run/tls/temporal.key
      TEMPORAL_TLS_INTERNODE_SERVER_NAME: temporal
      TEMPORAL_TLS: "true"
      TEMPORAL_TLS_CA: /run/tls/ca.crt
      TEMPORAL_TLS_SERVER_NAME: temporal
    volumes:
      - ./secrets/tls/ca.crt:/run/tls/ca.crt:ro
      - ./secrets/tls/temporal.crt:/run/tls/temporal.crt:ro
      - ./secrets/tls/temporal.key:/run/tls/temporal.key:ro
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address $$(hostname -i):7233 --tls --tls-ca-path /run/tls/ca.crt --tls-server-name temporal"]
  # The runner writes the suite, the run and the score into the same directory the model writes its cost files to, and reads the live mock-case log from it.
  # The invoking user, so the files on the host are theirs. NOEMA_BENCH_* are set by `make bench-up`.
  bench-runner:
    user: "${NOEMA_BENCH_UID:?set by make bench-up}:${NOEMA_BENCH_GID:?set by make bench-up}"
    environment:
      BENCH_OUT: /bench-out
    volumes:
      - ${NOEMA_BENCH_OUT:?set by make bench-up}:/bench-out
